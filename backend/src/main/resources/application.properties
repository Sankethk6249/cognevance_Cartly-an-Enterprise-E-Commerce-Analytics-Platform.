server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# Database: H2 by default, MySQL via env vars
spring.datasource.url=${DB_URL:jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-123456}
app.jwt.expiration-ms=86400000
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.base-url=${BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM:no-reply@cartly.local}

# Payments: mock (demo, no keys) or razorpay
payment.provider=${PAYMENT_PROVIDER:mock}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Image storage: local or cloudinary (unsigned upload preset)
storage.provider=${STORAGE_PROVIDER:local}
storage.local-dir=${UPLOAD_DIR:uploads}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}

# Email is enabled by setting SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true