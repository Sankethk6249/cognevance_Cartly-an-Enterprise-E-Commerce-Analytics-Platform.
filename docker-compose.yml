services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shopdb
    ports: ["3306:3306"]
    volumes: [dbdata:/var/lib/mysql]
  backend:
    build: ./backend
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://db:3306/shopdb
      DB_USER: root
      DB_PASSWORD: rootpass
      JWT_SECRET: change-this-to-a-long-random-secret-0123456789
      CORS_ORIGINS: http://localhost:5173
      BASE_URL: http://localhost:8080
volumes:
  dbdata: